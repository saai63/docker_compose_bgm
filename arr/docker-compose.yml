services:       

#  ██████╗ ██╗     ██╗   ██╗███████╗████████╗██╗   ██╗███╗   ██╗
# ██╔════╝ ██║     ██║   ██║██╔════╝╚══██╔══╝██║   ██║████╗  ██║
# ██║  ███╗██║     ██║   ██║█████╗     ██║   ██║   ██║██╔██╗ ██║
# ██║   ██║██║     ██║   ██║██╔══╝     ██║   ██║   ██║██║╚██╗██║
# ╚██████╔╝███████╗╚██████╔╝███████╗   ██║   ╚██████╔╝██║ ╚████║
#  ╚═════╝ ╚══════╝ ╚═════╝ ╚══════╝   ╚═╝    ╚═════╝ ╚═╝  ╚═══╝

  gluetun:
    image: qmcgaw/gluetun
    ports:
      - "8002:8000"
      - "9696:9696"      # Prowlarr
      - "8989:8989"      # Sonarr
      - "7878:7878"      # Radarr
      - "6970:6969"      # Whisparr
      - "8191:8191"      # FlareSolver
      - "8686:8686"      # Lidarr
      - "6767:6767"      # Bazarr
      - "8080:8080"      # qBitTorrent
      - "6881:6881"      # qBitTorrent
      - "6881:6881/udp"  # qBitTorrent
    cap_add:
      - NET_ADMIN
    privileged: true
    restart: unless-stopped
    volumes:
      - ./gluetun_config:/gluetun/auth
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING}
      - VPN_PORT_FORWARDING_PROVIDER=${VPN_PORT_FORWARDING_PROVIDER}
                 

# ██████╗ ██████╗  ██████╗ ██╗    ██╗██╗      █████╗ ██████╗ ██████╗ 
# ██╔══██╗██╔══██╗██╔═══██╗██║    ██║██║     ██╔══██╗██╔══██╗██╔══██╗
# ██████╔╝██████╔╝██║   ██║██║ █╗ ██║██║     ███████║██████╔╝██████╔╝
# ██╔═══╝ ██╔══██╗██║   ██║██║███╗██║██║     ██╔══██║██╔══██╗██╔══██╗
# ██║     ██║  ██║╚██████╔╝╚███╔███╔╝███████╗██║  ██║██║  ██║██║  ██║
# ╚═╝     ╚═╝  ╚═╝ ╚═════╝  ╚══╝╚══╝ ╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═
                              
  prowlarr:
    image: linuxserver/prowlarr:2.7.0.5723-ls166
    container_name: prowlarr
    volumes:
      - ${ARRPATH}/Prowlarr/config:/config
      - ${ARRPATH}/Prowlarr/backup:/data/Backup
      - ${ARRPATH}/Downloads:/downloads
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      - PROWLARR_IGNORE_SSL_ERRORS=true
    env_file:
      - '.env'
      
